# SwiftLint configuration for Runnit iOS.
# Docs: https://realm.github.io/SwiftLint/rule-directory.html

included:
  - "Runnit iOS"
  - "Runnit iOSTests"

excluded:
  - "**/.build"
  - "DerivedData"
  - "**/*.generated.swift"

# Opt-in rules worth enforcing beyond the default set.
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - overridden_super_call
  - prohibited_super_call
  - fatal_error_message
  - explicit_init

# Keep the signal high; these defaults are too noisy for a small SwiftUI app.
disabled_rules:
  - todo                      # tracked TODOs are fine
  - trailing_comma            # Xcode adds trailing commas in collections
  - multiple_closures_with_trailing_closure  # common in SwiftUI

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 140

identifier_name:
  min_length: 1          # single-letter locals like `m`, `c` are idiomatic here
  max_length: 50
  allowed_symbols: ["_"]

type_name:
  min_length: 3
  max_length: 45
  excluded:
    - Runnit_iOSApp        # Xcode derives the @main type name from "Runnit iOS"

# The in-memory preview/sample ModelContainer legitimately force-tries; a real
# failure there is a programmer error caught immediately in development.
force_try:
  severity: warning

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 2

reporter: "xcode"
